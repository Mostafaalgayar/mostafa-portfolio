    <style>:root{--bg: #1b1f24;--surface: #232a33;--surface2: #2d343f;--line: rgba(255, 255, 255, .07);--ink: #f0f2f4;--muted: #a8b4c7;--faint: #8b98ac;--accent: #5a9cf8;--display: "Space Grotesk", sans-serif;--body: "DM Sans", sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}a{color:inherit;text-decoration:none}section{scroll-margin-top:20px}::selection{background:var(--accent);color:#0b0f14}.dx-nav{position:absolute;top:0;left:0;width:100%;z-index:30}.dx-nav-inner{max-width:1180px;margin:0 auto;height:84px;display:flex;align-items:center;gap:34px;padding:0 26px}.dx-logo{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-1px}.dx-logo span{color:var(--accent)}.dx-links{display:flex;gap:26px;margin-left:auto}.dx-links a{font-size:13px;color:var(--muted);transition:color .2s}.dx-links a:hover{color:var(--ink)}.dx-status{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:12px;color:var(--muted);background:#ffffff05}.dx-status i{width:7px;height:7px;border-radius:50%;background:var(--accent)}.dx-hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(ellipse 50% 46% at 50% 100%,rgba(90,156,248,.16),transparent 68%)}.dx-hero-grid{position:relative;max-width:1180px;margin:0 auto;min-height:100vh;padding:84px 26px 0}.dx-hero-copy{position:absolute;left:26px;top:22%;z-index:3}.dx-dash{display:block;width:58px;height:4px;background:var(--ink);border-radius:2px;margin-bottom:30px}.dx-dash.center{margin:0 auto 26px}.dx-eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:0 0 16px}.dx-title{font-family:var(--display);font-weight:700;font-size:clamp(48px,6vw,96px);line-height:1.04;letter-spacing:-3px;margin:0;color:var(--ink)}.dx
